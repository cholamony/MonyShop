```html
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MonyShop Admin</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: #ccc;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .box h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    input[type="file"] {
      background: #fafafa;
      padding: 12px;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: contain;
      margin-top: 12px;
      border-radius: 12px;
      background: #eee;
    }

    .add-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .add-btn:active {
      opacity: 0.8;
    }

    .product {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      background: #fafafa;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: contain;
      border-radius: 10px;
      background: #eee;
      margin-bottom: 10px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
    }

    .product-type {
      color: #777;
      margin-top: 5px;
    }

    .price {
      color: #b8860b;
      font-weight: bold;
      font-size: 18px;
      margin-top: 7px;
    }

    .delete-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: #d32f2f;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 15px;
    }

  </style>
</head>


<body>


<header>

  <h1>💎 MonyShop Admin</h1>

  <p>គ្រប់គ្រងផលិតផល</p>

</header>


<div class="container">


  <!-- បន្ថែមផលិតផល -->

  <div class="box">

    <h2>➕ បន្ថែមផលិតផល</h2>


    <label>
      ឈ្មោះផលិតផល
    </label>

    <input
      id="name"
      type="text"
      placeholder="ឧ. ចិញ្ចៀនមាស 18K"
    >


    <label>
      ប្រភេទ
    </label>

    <select id="type">

      <option value="gold">
        មាស
      </option>

      <option value="platinum">
        ផ្លាទីន
      </option>

      <option value="ring">
        ចិញ្ចៀន
      </option>

      <option value="necklace">
        ខ្សែក
      </option>

      <option value="bracelet">
        ខ្សែដៃ
      </option>

    </select>


    <label>
      💰 តម្លៃ
    </label>

    <input
      id="price"
      type="text"
      placeholder="ឧ. $350"
    >


    <label>
      📷 រូបភាពផលិតផល
    </label>

    <input
      id="image"
      type="file"
      accept="image/*"
    >


    <img
      id="preview"
      alt="Preview"
    >


    <button
      class="add-btn"
      onclick="addProduct()"
    >
      ➕ បន្ថែមផលិតផល
    </button>

  </div>


  <!-- បញ្ជីផលិតផល -->

  <div class="box">

    <h2>
      📦 ផលិតផលរបស់ខ្ញុំ
    </h2>

    <div id="productList"></div>

  </div>


</div>


<script>


/* =========================
   ទាញយកផលិតផល
========================= */

let products =
  JSON.parse(
    localStorage.getItem("monyshop_products")
  ) || [];


/* =========================
   Preview រូបភាព
========================= */

const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");


imageInput.addEventListener(
  "change",
  function () {

    const file = this.files[0];

    if (!file) {

      preview.style.display = "none";

      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function (event) {

        preview.src =
          event.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =========================
   បន្ថែមផលិតផល
========================= */

function addProduct() {

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const type =
    document
      .getElementById("type")
      .value;


  const price =
    document
      .getElementById("price")
      .value
      .trim();


  const file =
    document
      .getElementById("image")
      .files[0];


  if (!name) {

    alert("សូមបញ្ចូលឈ្មោះផលិតផល");

    return;
  }


  if (!price) {

    alert("សូមបញ្ចូលតម្លៃផលិតផល");

    return;
  }


  if (!file) {

    alert("សូមជ្រើសរើសរូបភាពផលិតផល");

    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function (event) {

      const imageData =
        event.target.result;


      const product = {

        id: Date.now(),

        name: name,

        type: type,

        price: price,

        image: imageData

      };


      products.push(product);


      localStorage.setItem(
        "monyshop_products",
        JSON.stringify(products)
      );


      document
        .getElementById("name")
        .value = "";


      document
        .getElementById("price")
        .value = "";


      document
        .getElementById("image")
        .value = "";


      preview.src = "";

      preview.style.display =
        "none";


      displayProducts();


      alert(
        "✅ បានបន្ថែមផលិតផលជោគជ័យ!"
      );

    };


  reader.readAsDataURL(file);

}


/* =========================
   បង្ហាញផលិតផល
========================= */

function displayProducts() {

  const list =
    document.getElementById(
      "productList"
    );


  list.innerHTML = "";


  if (products.length === 0) {

    list.innerHTML =
      '<div class="empty">មិនទាន់មានផលិតផលទេ</div>';

    return;
  }


  products.forEach(
    function (product, index) {

      const div =
        document.createElement("div");


      div.className =
        "product";


      div.innerHTML = `

        <img
          class="product-image"
          src="${product.image}"
          alt="${product.name}"
        >

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-type">
          ${getTypeName(product.type)}
        </div>

        <div class="price">
          ${product.price}
        </div>

        <button
          class="delete-btn"
          onclick="deleteProduct(${index})"
        >
          🗑️ លុបផលិតផល
        </button>

      `;


      list.appendChild(div);

    }
  );

}


/* =========================
   ប្រែឈ្មោះប្រភេទ
========================= */

function getTypeName(type) {

  const types = {

    gold: "មាស",

    platinum: "ផ្លាទីន",

    ring: "ចិញ្ចៀន",

    necklace: "ខ្សែក",

    bracelet: "ខ្សែដៃ"

  };


  return types[type] || type;

}


/* =========================
   លុបផលិតផល
========================= */

function deleteProduct(index) {

  const confirmDelete =
    confirm(
      "តើអ្នកប្រាកដថាចង់លុបផលិតផលនេះមែនទេ?"
    );


  if (!confirmDelete) {

    return;
  }


  products.splice(index, 1);


  localStorage.setItem(
    "monyshop_products",
    JSON.stringify(products)
  );


  displayProducts();

}


/* =========================
   ចាប់ផ្តើម
========================= */

displayProducts();


</script>


</body>
</html>
```
