```html
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MonyShop - Jewelry</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 24px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #ddd;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 15px;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
    }

    .category {
      border: 1px solid #ddd;
      background: white;
      border-radius: 20px;
      padding: 10px 16px;
      white-space: nowrap;
      cursor: pointer;
    }

    .category.active {
      background: #111;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 170px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 65px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-weight: bold;
      font-size: 16px;
    }

    .product-type {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .price {
      font-weight: bold;
      color: #b8860b;
      margin-top: 8px;
      font-size: 17px;
    }

    .detail-btn {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: none;
      border-radius: 9px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .detail-btn:active {
      opacity: 0.8;
    }

    @media (max-width: 400px) {
      .product-image {
        height: 140px;
      }

      .product-name {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💎 MonyShop</h1>
  <p>គ្រឿងអលង្ការ • មាស • ផ្លាទីន</p>
</header>

<div class="container">

  <input
    id="search"
    class="search"
    type="search"
    placeholder="🔎 ស្វែងរកផលិតផល..."
  >

  <div class="categories">

    <button class="category active" data-category="all">
      ទាំងអស់
    </button>

    <button class="category" data-category="gold">
      មាស
    </button>

    <button class="category" data-category="platinum">
      ផ្លាទីន
    </button>

    <button class="category" data-category="ring">
      ចិញ្ចៀន
    </button>

    <button class="category" data-category="necklace">
      ខ្សែក
    </button>

    <button class="category" data-category="bracelet">
      ខ្សែដៃ
    </button>

  </div>

  <div id="products" class="products"></div>

</div>

<script>

const products = [

  {
    name: "ចិញ្ចៀនមាស 18K",
    type: "មាស • ចិញ្ចៀន",
    price: "$320",
    category: "ring",
    icon: "💍"
  },

  {
    name: "ចិញ្ចៀនផ្លាទីន",
    type: "ផ្លាទីន • ចិញ្ចៀន",
    price: "$480",
    category: "platinum",
    icon: "💎"
  },

  {
    name: "ខ្សែកមាស",
    type: "មាស • ខ្សែក",
    price: "$580",
    category: "necklace",
    icon: "📿"
  },

  {
    name: "ខ្សែដៃមាស",
    type: "មាស • ខ្សែដៃ",
    price: "$450",
    category: "bracelet",
    icon: "✨"
  },

  {
    name: "ចិញ្ចៀនគូស្នេហ៍",
    type: "មាស • ចិញ្ចៀន",
    price: "$390",
    category: "ring",
    icon: "💍"
  },

  {
    name: "ខ្សែដៃផ្លាទីន",
    type: "ផ្លាទីន • ខ្សែដៃ",
    price: "$620",
    category: "bracelet",
    icon: "💎"
  }

];

let currentCategory = "all";

const productsContainer =
  document.getElementById("products");

const search =
  document.getElementById("search");


/* =========================
   បង្ហាញព័ត៌មានផលិតផល
========================= */

function showProduct(name, type, price, icon) {

  const oldModal = document.getElementById("productModal");

  if (oldModal) {
    oldModal.remove();
  }

  const modal = document.createElement("div");

  modal.id = "productModal";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
    ">

      <div style="
        background:white;
        width:100%;
        max-width:400px;
        border-radius:18px;
        padding:25px;
        text-align:center;
      ">

        <div style="font-size:70px;">
          ${icon}
        </div>

        <h2 style="margin:10px 0;">
          ${name}
        </h2>

        <p style="color:#777;">
          ${type}
        </p>

        <div style="
          font-size:24px;
          font-weight:bold;
          color:#b8860b;
          margin:15px 0;
        ">
          ${price}
        </div>

        <button
          onclick="document.getElementById('productModal').remove()"
          style="
            width:100%;
            padding:13px;
            border:0;
            border-radius:10px;
            background:#111;
            color:white;
            font-size:16px;
          "
        >
          បិទ
        </button>

      </div>

    </div>
  `;

  document.body.appendChild(modal);
}


/* =========================
   បង្ហាញផលិតផល
========================= */

function displayProducts() {

  const keyword =
    search.value.toLowerCase().trim();

  const filteredProducts =
    products.filter(product => {

      const categoryMatch =
        currentCategory === "all" ||
        product.category === currentCategory;

      const searchMatch =
        product.name.toLowerCase()
          .includes(keyword) ||
        product.type.toLowerCase()
          .includes(keyword);

      return categoryMatch && searchMatch;

    });


  productsContainer.innerHTML = "";


  if (filteredProducts.length === 0) {

    productsContainer.innerHTML =
      "<p>រកមិនឃើញផលិតផលទេ</p>";

    return;
  }


  filteredProducts.forEach(product => {

    const card =
      document.createElement("div");

    card.className = "product";


    card.innerHTML = `

      <div class="product-image">
        ${product.icon}
      </div>

      <div class="product-info">

        <div class="product-name">
          ${product.name}
        </div>

        <div class="product-type">
          ${product.type}
        </div>

        <div class="price">
          ${product.price}
        </div>

        <button
          class="detail-btn"
          onclick="showProduct(
            '${product.name}',
            '${product.type}',
            '${product.price}',
            '${product.icon}'
          )"
        >
          មើលព័ត៌មាន
        </button>

      </div>

    `;


    productsContainer.appendChild(card);

  });

}


/* =========================
   Category
========================= */

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category")
        .forEach(btn =>
          btn.classList.remove("active")
        );

      button.classList.add("active");

      currentCategory =
        button.dataset.category;

      displayProducts();

    });

  });


/* =========================
   Search
========================= */

search.addEventListener(
  "input",
  displayProducts
);


/* =========================
   Start
========================= */

displayProducts();

</script>

</body>
</html>
```
